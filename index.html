<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2f3061" />
  <meta name="description" content="Caffè Casa — Lo Spirito Italiano" />
  <title>Caffè Casa | Lo Spirito Italiano</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --brand:#2f3061;
      --brand-deep:#23244d;
      --ink:#f4f2ee;
      --soft:rgba(244,242,238,.62);
      --gold:#c9b48a;
      --line:rgba(201,180,138,.28);
      --line-strong:rgba(201,180,138,.65);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      font-family:"Cairo",system-ui,sans-serif;
      font-weight:300;
      color:var(--ink);
      background:
        radial-gradient(120% 70% at 50% 0%, #3a3b73 0%, var(--brand) 45%, var(--brand-deep) 100%);
      background-attachment:fixed;
      overflow-x:hidden;
      -webkit-font-smoothing:antialiased;
    }

    .page{
      width:min(100%, 440px);
      min-height:100vh;
      margin:auto;
      padding:26px 26px 34px;
      display:flex;
      flex-direction:column;
    }

    .top-actions{display:flex;justify-content:flex-end}

    .share-btn{
      width:38px;height:38px;
      border:0;
      background:transparent;
      color:var(--soft);
      display:grid;place-items:center;
      cursor:pointer;
      transition:color .3s ease;
    }
    .share-btn:hover{color:var(--gold)}
    .share-btn svg{width:19px;height:19px}

    .profile{
      text-align:center;
      padding:28px 0 46px;
      margin-top:auto;
    }

    /* الشعار بدون أي إطار أو دائرة أو ظل */
    .logo{
      display:block;
      width:min(64vw, 210px);
      height:auto;
      margin:0 auto;
    }

    .rule{
      width:34px;
      height:1px;
      margin:34px auto 0;
      background:var(--gold);
      opacity:.7;
    }

    .links{
      display:grid;
      gap:0;
      margin-bottom:auto;
      border-top:1px solid var(--line);
    }

    .link-card{
      display:flex;
      align-items:center;
      gap:18px;
      padding:22px 4px;
      text-decoration:none;
      color:var(--ink);
      border-bottom:1px solid var(--line);
      transition:border-color .35s ease, padding .35s ease, background .35s ease;
    }
    .link-card:hover{
      border-bottom-color:var(--line-strong);
      padding-inline:12px;
      background:linear-gradient(90deg, transparent, rgba(201,180,138,.06), transparent);
    }

    .icon{
      width:22px;height:22px;
      flex:0 0 22px;
      color:var(--gold);
      display:grid;place-items:center;
    }
    .icon svg{width:22px;height:22px}

    .link-text{flex:1;text-align:right}
    .link-title{
      display:block;
      font-family:"Cormorant Garamond","Cairo",serif;
      font-weight:500;
      font-size:22px;
      letter-spacing:2.5px;
      text-transform:uppercase;
      line-height:1.2;
    }
    .link-sub{
      display:block;
      margin-top:3px;
      font-size:11.5px;
      letter-spacing:.8px;
      color:var(--soft);
      direction:ltr;
      text-align:right;
    }

    .arrow{
      width:20px;height:20px;flex:0 0 20px;
      color:var(--soft);
      transition:transform .35s ease, color .35s ease;
    }
    .link-card:hover .arrow{transform:translateX(-5px);color:var(--gold)}

    .footer{
      text-align:center;
      padding-top:42px;
      font-family:"Cormorant Garamond",serif;
      font-size:12px;
      letter-spacing:3px;
      text-transform:uppercase;
      color:rgba(244,242,238,.4);
    }

    .toast{
      position:fixed;left:50%;bottom:24px;
      transform:translate(-50%,20px);
      opacity:0;pointer-events:none;
      background:var(--ink);color:var(--brand-deep);
      padding:9px 20px;
      font-size:12px;letter-spacing:.4px;
      transition:.3s ease;z-index:10;
    }
    .toast.show{opacity:1;transform:translate(-50%,0)}

    .profile,.links,.footer{animation:fade 1s ease both}
    .links{animation-delay:.15s}
    .footer{animation-delay:.3s}
    @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="page">
    <div class="top-actions">
      <button class="share-btn" aria-label="مشاركة الصفحة" onclick="sharePage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/>
          <path d="m8.2 10.8 7.5-4.3M8.2 13.2l7.5 4.3"/>
        </svg>
      </button>
    </div>

    <section class="profile">
      <img class="logo" src="logo.png" alt="Caffè Casa — Lo Spirito Italiano">
      <div class="rule"></div>
    </section>

    <section class="links" aria-label="روابط التواصل الاجتماعي">

      <a class="link-card" href="https://www.instagram.com/caffecasalibya/" target="_blank" rel="noopener noreferrer">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
            <rect x="3" y="3" width="18" height="18" rx="5"/>
            <circle cx="12" cy="12" r="4.2"/>
            <circle cx="17.5" cy="6.7" r=".9"/>
          </svg>
        </span>
        <span class="link-text">
          <span class="link-title">Instagram</span>
          <span class="link-sub">@caffecasalibya</span>
        </span>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </a>

      <a class="link-card" href="https://www.tiktok.com/@caffe.casa.ly" target="_blank" rel="noopener noreferrer">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 4v10.2a4.3 4.3 0 1 1-3.5-4.2"/>
            <path d="M14 4c.8 2.7 2.5 4.2 5 4.7"/>
          </svg>
        </span>
        <span class="link-text">
          <span class="link-title">TikTok</span>
          <span class="link-sub">@caffe.casa.ly</span>
        </span>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </a>

      <a class="link-card" href="https://www.facebook.com/share/19TtfNroBA/" target="_blank" rel="noopener noreferrer">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round">
            <path d="M13.5 21v-8h2.7l.4-3h-3.1V8.1c0-.9.3-1.6 1.7-1.6h1.8V3.8c-.3 0-1.3-.1-2.4-.1-2.4 0-4 1.5-4 4.1V10H8v3h2.6v8h2.9Z"/>
          </svg>
        </span>
        <span class="link-text">
          <span class="link-title">Facebook</span>
          <span class="link-sub">Caffè Casa Libya</span>
        </span>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </a>

    </section>

    <footer class="footer">Caffè Casa · Libya</footer>
  </main>

  <div class="toast" id="toast">تم نسخ رابط الصفحة</div>

  <script>
    async function sharePage(){
      const data = {title: "Caffè Casa", text: "Caffè Casa — Lo Spirito Italiano", url: location.href};
      try{
        if(navigator.share){
          await navigator.share(data);
        }else{
          await navigator.clipboard.writeText(location.href);
          showToast();
        }
      }catch(e){}
    }
    function showToast(){
      const toast = document.getElementById("toast");
      toast.classList.add("show");
      setTimeout(()=>toast.classList.remove("show"),1800);
    }
  </script>
</body>
</html>
